kind = "web"
previewPath = "/"
title = "PRO. — Plataforma Deportiva"
version = "1.0.0"
id = "artifacts/pro-sport"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20686

[services.development]
run = "pnpm --filter @workspace/pro-sport run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pro-sport", "run", "build" ]
publicDir = "artifacts/pro-sport/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20686"
BASE_PATH = "/"
